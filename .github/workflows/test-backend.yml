name: Test JARVIS backend

on:
  push:
    branches: [main, jarvis-galaxy-localhost]
    paths:
      - 'backend/**'
      - 'tests/**'
      - '.env.example'
      - '.gitignore'
      - '.github/workflows/test-backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'tests/**'
      - '.env.example'
      - '.gitignore'
      - '.github/workflows/test-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test local API safety basics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest
      - name: Compile Python modules
        run: python -m compileall -q backend tests
      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.current = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      self.in_script = True
                      self.current = []
              def handle_endtag(self, tag):
                  if tag == "script" and self.in_script:
                      self.scripts.append("".join(self.current))
                      self.in_script = False
              def handle_data(self, data):
                  if self.in_script:
                      self.current.append(data)

          parser = Scripts()
          parser.feed(Path("backend/web/index.html").read_text(encoding="utf-8"))
          assert parser.scripts, "No dashboard JavaScript found"
          Path("/tmp/jarvis-dashboard.js").write_text("\\n".join(parser.scripts), encoding="utf-8")
          PY
          node --check /tmp/jarvis-dashboard.js
      - name: Run tests
        run: python -m pytest -q
